<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>الصفحة غير موجودة | MEHDI PITA</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        background: #070614;
        color: #e4e4e7;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 440px;
        padding: 32px;
        background: #0d0b24;
        border: 1px solid rgba(168, 85, 247, 0.4);
        border-radius: 24px;
      }
      h1 { margin-top: 0; color: #fff; }
      p { color: #c4b5fd; }
      a { color: #67e8f9; }
    </style>
    <script>
      const path = window.location.pathname;
      if (path.toLowerCase().includes('pitadmin')) {
        const segments = path.split('/').filter(Boolean);
        const isRepoSubdir = segments[0]?.toLowerCase() === 'mehdi-pita';
        const base = isRepoSubdir ? `/${segments[0]}/` : '/';
        window.location.replace(`${base}#/pitadmin${window.location.search}`);
      }
    </script>
  </head>
  <body>
    <main class="card">
      <h1>الصفحة غير موجودة</h1>
      <p>عذراً، لم نتمكن من العثور على الصفحة المطلوبة.</p>
      <p lang="fr" dir="ltr">Désolé, cette page est introuvable.</p>
      <a href="https://mehdipita.fyi/">العودة إلى الموقع الرسمي لـ MEHDI PITA</a>
    </main>
  </body>
</html>
